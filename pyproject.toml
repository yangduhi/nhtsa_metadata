[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "nhtsa-metadata"
version = "0.1.0"
description = "Metadata-only NHTSA crash test catalog DB"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "httpx>=0.27",
  "typer>=0.12",
  "rich>=13.7",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.5",
  "mypy>=1.10",
  "respx>=0.21",
]

[project.scripts]
nhtsa-metadata = "nhtsa_metadata.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/nhtsa_metadata"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "live: tests that call live NHTSA services; never run in default verify",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
packages = ["nhtsa_metadata"]
warn_unused_ignores = true
warn_return_any = true
no_implicit_optional = true
